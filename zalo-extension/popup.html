<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ms. Dung Shiny Zalo Bridge</title>
  <style>
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 14px;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .icon {
      width: 28px;
      height: 28px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }
    h3 {
      margin: 0;
      font-size: 13px;
      font-weight: bold;
      color: #0f172a;
    }
    p {
      margin: 0;
      font-size: 11px;
      color: #64748b;
    }
    .status-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: bold;
      color: #047857;
      background: #d1fae5;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }
    .guide {
      font-size: 11px;
      color: #475569;
      line-height: 1.4;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">💬</div>
    <div>
      <h3>Ms. Dung Shiny Bridge</h3>
      <p>Cầu Nối Tự Động Điền Tin Zalo</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-badge">
      <span class="dot"></span>
      <span>Đang Hoạt Động Sẵn Sàng</span>
    </div>
    <div class="guide">
      Mỗi khi bạn bấm gửi Học phí, BTVN hay Nhận xét từ web Ms. Dung Shiny, tiện ích sẽ <strong>tự động dán (Ctrl+V)</strong> nội dung vào khung chat Zalo của phụ huynh.
    </div>
  </div>
</body>
</html>
